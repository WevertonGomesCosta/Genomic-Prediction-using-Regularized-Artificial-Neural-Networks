name: Lightweight reproducibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  saved-output-render:
    runs-on: ubuntu-latest
    env:
      RUN_ANN: "0"
      RUN_ANN_TUNING: "0"
      RUN_GBLUP: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.8.3"

      - name: Set up R from renv.lock
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Restore lightweight R dependencies
        shell: Rscript {0}
        run: |
          renv::restore(
            packages = c("workflowr", "rmarkdown", "knitr"),
            prompt = FALSE
          )

      - name: Verify heavy model packages are absent
        shell: Rscript {0}
        run: |
          stopifnot(!requireNamespace("torch", quietly = TRUE))
          stopifnot(!requireNamespace("sommer", quietly = TRUE))

      - name: Record canonical output hashes
        shell: bash
        run: |
          find output/simulated -type f -print0 |
            sort -z |
            xargs -0 sha256sum > /tmp/output-before.sha256
          test "$(wc -l < /tmp/output-before.sha256)" -eq 36

      - name: Build saved-output model pages
        shell: Rscript {0}
        run: |
          workflowr::wflow_build(c(
            "analysis/simulated_data_ann.Rmd",
            "analysis/simulated_data_gblup.Rmd"
          ))

      - name: Verify canonical outputs are unchanged
        shell: bash
        run: |
          find output/simulated -type f -print0 |
            sort -z |
            xargs -0 sha256sum > /tmp/output-after.sha256
          diff -u /tmp/output-before.sha256 /tmp/output-after.sha256
          git diff --exit-code -- output
