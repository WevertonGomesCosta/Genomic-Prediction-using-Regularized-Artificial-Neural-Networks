name: One-time M03 final audit cleanup

on:
  push:
    branches:
      - m03-direct-reader-flow

permissions:
  contents: write

jobs:
  cleanup-m03:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: m03-direct-reader-flow
          fetch-depth: 0

      - name: Apply audited M03 refinements
        run: python m03_final_cleanup.py

      - name: Commit changes and remove temporary files
        shell: bash
        run: |
          rm -f m03_final_cleanup.py .github/workflows/m03_final_audit_cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize M03 scientific wording and reader flow"
          git push origin HEAD:m03-direct-reader-flow
