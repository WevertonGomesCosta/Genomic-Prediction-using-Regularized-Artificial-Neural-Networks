name: reader-first-contract-finalize

on:
  push:
    branches:
      - didactic-reader-first-cleanup

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: didactic-reader-first-cleanup
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Apply cleanup and preserve output contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          # Reuse the already-audited reader-first transformation.
          workflow = Path('.github/workflows/reader-first-cleanup.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'reader-first-cleanup.py', 'exec'))

          # Fix the transformed M01 regex escape.
          audit = Path('analysis/simulated_data_audit.Rmd')
          audit_text = audit.read_text()
          audit_text = audit_text.replace(r'"^\s*Escal"', r'"^\\s*Escal"')

          # Preserve the canonical M01 Check/Status/Details contract in a hidden
          # compatibility chunk. It reports the same scientific conditions but
          # does not stop execution.
          audit_contract = r'''
          ```{r audit-output-contract, include=FALSE}
          compat_status <- function(condition, failure = "BLOCKED", success = "PASS") {
            c(failure, success)[1L + as.integer(isTRUE(condition))]
          }

          audit_log <- data.frame(
            Check = character(),
            Status = character(),
            Details = character(),
            stringsAsFactors = FALSE
          )

          add_compat_audit <- function(check, status, details) {
            audit_log <<- rbind(
              audit_log,
              data.frame(
                Check = check,
                Status = status,
                Details = as.character(details),
                stringsAsFactors = FALSE
              )
            )
            invisible(NULL)
          }

          scale_key_has_internal_whitespace <- any(grepl("[[:space:]]", scale_source_keys))
          h2_difference <- abs(scenario_summary$H2_realized - scenario_summary$H2_nominal)
          cv_difference <- abs(scenario_summary$CV_empirical_pct - scenario_summary$CV_metadata)

          short_ld <- ld_summary$Mean_r2[ld_summary$Distance_cM == 0.5]
          medium_ld <- ld_summary$Mean_r2[ld_summary$Distance_cM == 10]
          ld_50 <- ld_summary$Mean_r2[ld_summary$Distance_cM == 50]
          ld_100 <- ld_summary$Mean_r2[ld_summary$Distance_cM == 100]
          ld_200 <- ld_summary$Mean_r2[ld_summary$Distance_cM == 200]
          ld_decay_ok <-
            short_ld > medium_ld &&
            medium_ld > ld_50 &&
            ld_50 > interchromosomal_ld$Mean_r2 &&
            interchromosomal_ld$Mean_r2 < 0.02
          long_distance_plateau <-
            is.finite(ld_100) && is.finite(ld_200) &&
            ld_100 > 0.05 && ld_200 > 0.05 &&
            ld_100 > 10 * interchromosomal_ld$Mean_r2 &&
            ld_200 > 10 * interchromosomal_ld$Mean_r2

          dim_ok <-
            identical(dim(phenotype), c(1000L, 6L)) &&
            identical(dim(true_genetic_value), c(1000L, 6L)) &&
            identical(dim(geno_012), c(1000L, 4010L))
          finite_ok <- all(is.finite(phenotype)) && all(is.finite(true_genetic_value))
          code_012_ok <- identical(sort(unique(as.vector(geno_012))), 0:2)
          code_1122_ok <- identical(codes_1122, c(11L, 12L, 22L))
          canonical_coding_ok <- identical(sort(unique(as.vector(geno_m101))), -1:1)
          equivalent_genotype_files <- genotype_mismatches == 0L

          map_ok <-
            nrow(genetic_map) == 4010L &&
            length(unique(genetic_map$LG)) == 10L &&
            all(map_summary$Markers == 401L) &&
            all(abs(map_summary$Min_cM) < 1e-12) &&
            all(abs(map_summary$Max_cM - 200) < 1e-12) &&
            all(abs(map_summary$Spacing_cM - 0.5) < 1e-12)

          expected_qtl_n <- c(8, 40, 80, 120, 240, 480)
          expected_h2 <- c(0.7, 0.7, 0.5, 0.5, 0.3, 0.3)
          scenario_metadata_ok <-
            nrow(control_table) == 6L &&
            identical(as.numeric(control_table$QTL_N), expected_qtl_n) &&
            isTRUE(all.equal(as.numeric(control_table$H2_nominal), expected_h2, tolerance = 1e-12))
          qtl_lengths <- vapply(qtl_lists, length, integer(1))
          qtl_lengths_ok <- identical(as.numeric(qtl_lengths), expected_qtl_n)
          qtl_indices_ok <- all(unlist(qtl_lists) >= 1L & unlist(qtl_lists) <= 4010L)
          qtl_unique_ok <- all(vapply(qtl_lists, function(x) !anyDuplicated(x), logical(1)))
          qtl_distribution_ok <-
            all(as.matrix(qtl_by_lg[, paste0("LG", 9:10), drop = FALSE]) == 0) &&
            all(vapply(seq_len(nrow(qtl_by_lg)), function(i) {
              all(as.numeric(qtl_by_lg[i, paste0("LG", 1:8)]) == expected_qtl_n[i] / 8)
            }, logical(1)))

          row_order_contract_ok <-
            nrow(phenotype) == nrow(true_genetic_value) &&
            nrow(phenotype) == nrow(geno_012)
          phenotype_genetic_signal_ok <- all(scenario_summary$Cor_P_G > 0.5)
          h2_ok <- !any(h2_difference > 0.03)
          cv_ok <- !any(cv_difference > 1)

          f2_frequency_ok <- max(abs(as.numeric(geno_frequency) - c(0.25, 0.50, 0.25))) < 0.02
          maf_ok <- min(maf) > 0.40

          parent_structure_ok <- nrow(parents) == 20L && ncol(parents) == 405L
          parent1_ok <- all(parent_genotypes[parent_id == 1, ] == 1)
          parent2_ok <- all(parent_genotypes[parent_id == 2, ] == 0)
          lg_parent_ok <-
            identical(sort(unique(as.integer(parent_lg))), 1:10) &&
            all(table(parent_lg) == 2L) &&
            all(parent_nmarkers == 401)

          add_compat_audit(
            "Simulation-control key formatting",
            compat_status(!scale_key_has_internal_whitespace, failure = "WARNING"),
            if (scale_key_has_internal_whitespace) {
              paste(
                "The source control file contains internal whitespace in the C1 Scale key (Escal<tab>a).",
                "Key whitespace was normalized for parsing; the stored numeric value was not altered."
              )
            } else {
              "No internal whitespace was detected in the simulation-control keys."
            }
          )
          add_compat_audit(
            "Nominal versus realized heritability",
            compat_status(h2_ok, failure = "WARNING"),
            paste(
              "Absolute differences:", paste(round(h2_difference, 4), collapse = ", "),
              ". Differences are documented rather than used to redefine the scenarios."
            )
          )
          add_compat_audit(
            "CV metadata versus empirical phenotype CV",
            compat_status(cv_ok, failure = "WARNING"),
            paste(
              "The simulator reports CV metadata = 12 for all scenarios; empirical phenotype CV values are reported separately.",
              "The metadata field is therefore not interpreted automatically as the empirical coefficient of variation."
            )
          )
          long_distance_detail <- if (long_distance_plateau) {
            paste(
              ". LD declines strongly up to 50 cM but remains elevated at 100-200 cM relative to the interchromosomal reference.",
              "This is documented as a property requiring interpretation of the simulator's long-distance recombination behavior, not as evidence of data corruption."
            )
          } else {
            ". No marked long-distance LD plateau was detected."
          }
          add_compat_audit(
            "Long-distance LD behavior",
            compat_status(!long_distance_plateau, failure = "WARNING"),
            paste(
              "Mean r2 at 50, 100, and 200 cM:",
              paste(round(c(ld_50, ld_100, ld_200), 4), collapse = ", "),
              "; interchromosomal mean r2:", round(interchromosomal_ld$Mean_r2, 5),
              long_distance_detail
            )
          )

          add_compat_audit("Expected files", compat_status(all(file_table$Exists)), sprintf("All %d expected files are present.", length(expected_files)))
          add_compat_audit("Core dimensions", compat_status(dim_ok), "Expected phenotype and genetic-value matrices: 1000 x 6; expected genotype matrices: 1000 x 4010.")
          add_compat_audit("Finite phenotype and genetic values", compat_status(finite_ok), if (finite_ok) "All phenotypic and true genetic values are finite." else "Non-finite values were detected.")
          add_compat_audit("Genotype codes 0/1/2", compat_status(code_012_ok), paste("Observed codes:", paste(codes_012, collapse = ", ")))
          add_compat_audit("Genotype codes 11/12/22", compat_status(code_1122_ok), paste("Observed codes:", paste(codes_1122, collapse = ", ")))
          add_compat_audit("Equivalence of genotype files", compat_status(equivalent_genotype_files), "Checked mapping 11 -> 2, 12 -> 1, and 22 -> 0 after orienting both matrices as individuals x markers.")
          add_compat_audit("Canonical -1/0/1 coding", compat_status(canonical_coding_ok), "Canonical coding is genotype_012 - 1.")
          add_compat_audit("Genetic map structure", compat_status(map_ok), "Expected 10 linkage groups, 401 markers per group, 200 cM per group, and 0.5 cM marker spacing.")
          add_compat_audit("Unique map marker names", compat_status(n_duplicate_marker_names == 0L), sprintf("%d duplicated marker names detected.", n_duplicate_marker_names))
          add_compat_audit("Simulation scenario metadata", compat_status(scenario_metadata_ok), "Six scenarios expected with QTL counts 8, 40, 80, 120, 240, and 480 and nominal heritabilities 0.7, 0.7, 0.5, 0.5, 0.3, and 0.3.")
          add_compat_audit("QTL-list lengths", compat_status(qtl_lengths_ok), paste("Observed QTL-list lengths:", paste(qtl_lengths, collapse = ", ")))
          add_compat_audit("QTL indices within map", compat_status(qtl_indices_ok), "All QTL indices must lie between 1 and 4010.")
          add_compat_audit("Unique QTL within scenario", compat_status(qtl_unique_ok), "No duplicated QTL index is expected within a simulation scenario.")
          add_compat_audit("QTL distribution across linkage groups", compat_status(qtl_distribution_ok), "The simulation design places QTL evenly across LG1-LG8; LG9 and LG10 contain no selected QTL.")
          add_compat_audit("Row-order contract", compat_status(row_order_contract_ok), "Phenotype, true genetic-value, and genotype matrices contain the same 1000 rows. Because the simulation files do not provide explicit individual IDs, row position is adopted as the canonical individual identifier; independent identity verification is not available.")
          add_compat_audit("Phenotype-genetic signal", compat_status(phenotype_genetic_signal_ok, failure = "WARNING"), paste("Phenotype-true genetic correlations:", paste(round(scenario_summary$Cor_P_G, 4), collapse = ", ")))
          add_compat_audit("Missing genotypes", compat_status(missing_genotypes == 0L), sprintf("%d missing genotype cells.", missing_genotypes))
          add_compat_audit("Duplicate individuals", compat_status(duplicate_individuals == 0L), sprintf("%d duplicate genotype profiles.", duplicate_individuals))
          add_compat_audit("Duplicate markers", compat_status(duplicate_markers == 0L, failure = "WARNING"), sprintf("%d duplicate marker profiles.", duplicate_markers))
          add_compat_audit("Monomorphic markers", compat_status(monomorphic_markers == 0L, failure = "WARNING"), sprintf("%d monomorphic markers.", monomorphic_markers))
          add_compat_audit("Overall F2 genotype frequencies", compat_status(f2_frequency_ok, failure = "WARNING"), paste("Observed proportions:", paste(round(as.numeric(geno_frequency), 5), collapse = ", ")))
          add_compat_audit("Minor allele frequency", compat_status(maf_ok, failure = "WARNING"), sprintf("MAF range: %.4f to %.4f; median %.4f.", min(maf), max(maf), median(maf)))
          add_compat_audit("Parental file dimensions", compat_status(parent_structure_ok), "Expected 20 rows: two parents x 10 linkage groups, with 401 marker states per linkage group.")
          add_compat_audit("Parental genotype contrast", compat_status(parent1_ok && parent2_ok), "Parent 1 is fixed for state 1 and parent 2 is fixed for state 0 across all markers.")
          add_compat_audit("Parental linkage-group structure", compat_status(lg_parent_ok), "Each of the 10 linkage groups is represented for both parents.")
          add_compat_audit("map.rds readability", "PASS", paste("Object successfully read; class:", paste(class(map_rds), collapse = ", ")))
          add_compat_audit("map.rds row count", compat_status(!is.null(dim(map_rds)) && nrow(map_rds) == nrow(genetic_map)), paste("Observed rows:", nrow(map_rds), "; text-map markers:", nrow(genetic_map)))
          add_compat_audit(
            "Short-to-medium distance LD decay",
            compat_status(ld_decay_ok, failure = "WARNING"),
            paste(
              "Mean r2 at 0.5, 10, and 50 cM:", paste(round(c(short_ld, medium_ld, ld_50), 4), collapse = ", "),
              "; interchromosomal mean r2:", round(interchromosomal_ld$Mean_r2, 5)
            )
          )

          audit_log$Status <- factor(audit_log$Status, levels = c("BLOCKED", "WARNING", "PASS"))
          audit_log <- audit_log[order(audit_log$Status), , drop = FALSE]
          rownames(audit_log) <- NULL
          ```
          '''

          marker = '# Audit summary\n'
          if marker not in audit_text:
              raise RuntimeError('M01 Audit summary marker not found')
          audit_text = audit_text.replace(marker, audit_contract + '\n' + marker, 1)
          audit_text = audit_text.replace(
              'write.csv(\n  audit_overview,\n  file.path(output_dir, "simulated_audit_summary.csv"),',
              'write.csv(\n  audit_log,\n  file.path(output_dir, "simulated_audit_summary.csv"),',
              1,
          )
          audit.write_text(audit_text)

          # Preserve M02's canonical validation_log contract and cv_design$audit
          # while keeping the public page reader-first.
          validation = Path('analysis/simulated_data_validation.Rmd')
          validation_text = validation.read_text()
          validation_contract = r'''
          ```{r validation-output-contract, include=FALSE}
          compat_check_status <- function(condition, failure = "BLOCKED", success = "PASS") {
            c(failure, success)[1L + as.integer(isTRUE(condition))]
          }

          validation_log <- data.frame(
            Check = character(), Status = character(), Details = character(),
            stringsAsFactors = FALSE
          )
          add_compat_check <- function(check, status, details) {
            validation_log <<- rbind(
              validation_log,
              data.frame(Check = check, Status = status, Details = as.character(details), stringsAsFactors = FALSE)
            )
            invisible(NULL)
          }

          audit_file <- project_path("output", "simulated", "audit", "simulated_audit_summary.csv")
          required_files <- c(input_file, audit_file)
          files_exist <- file.exists(required_files)
          audit_summary <- read.csv(audit_file, stringsAsFactors = FALSE)
          n_blocked_audit <- sum(audit_summary$Status == "BLOCKED", na.rm = TRUE)
          required_components <- c("metadata", "phenotype", "true_genetic_value", "genotype_m101")
          components_ok <- all(required_components %in% names(simulated_common))
          individual_universe_ok <-
            length(ids) == 1000L && !anyDuplicated(ids) &&
            identical(sort(ids), seq_len(1000L)) &&
            nrow(simulated_common$phenotype) == length(ids) &&
            nrow(simulated_common$true_genetic_value) == length(ids) &&
            nrow(simulated_common$genotype_m101) == length(ids)

          outer_row_count_ok <- nrow(outer_assignments) == length(ids) * N_OUTER_REPEATS
          outer_once_per_repeat <- all(table(outer_assignments$Repetition, outer_assignments$ID) == 1L)
          outer_balanced <- all(outer_sizes$Assessment_N == 200L & outer_sizes$Analysis_N == 800L)
          outer_patterns <- do.call(rbind, lapply(seq_len(N_OUTER_REPEATS), function(rep_id) {
            x <- outer_assignments[outer_assignments$Repetition == rep_id, c("ID", "OuterFold")]
            x <- x[order(x$ID), ]
            x$OuterFold
          }))
          unique_repetition_patterns <- !anyDuplicated(as.data.frame(outer_patterns))
          assessment_frequency_ok <- all(table(outer_assignments$ID) == N_OUTER_REPEATS)
          outer_split_integrity <- all(vapply(outer_splits, function(x) {
            length(x$analysis_ids) == 800L && length(x$assessment_ids) == 200L &&
            length(intersect(x$analysis_ids, x$assessment_ids)) == 0L &&
            identical(sort(c(x$analysis_ids, x$assessment_ids)), sort(ids))
          }, logical(1)))

          inner_row_count_ok <- nrow(inner_assignments) == length(outer_splits) * 800L
          inner_balanced <- all(inner_sizes$Assessment_N == 200L & inner_sizes$Analysis_N == 600L)
          inner_assignment_integrity <- all(vapply(names(outer_splits), function(split_id) {
            x <- inner_assignments[inner_assignments$SplitID == split_id, ]
            outer_analysis_ids <- outer_splits[[split_id]]$analysis_ids
            nrow(x) == 800L && !anyDuplicated(x$ID) &&
            identical(sort(x$ID), sort(outer_analysis_ids)) &&
            identical(sort(unique(x$InnerFold)), seq_len(N_INNER_FOLDS))
          }, logical(1)))
          inner_split_integrity <- all(vapply(names(inner_splits), function(split_id) {
            outer_analysis_ids <- outer_splits[[split_id]]$analysis_ids
            all(vapply(inner_splits[[split_id]], function(x) {
              length(x$analysis_ids) == 600L && length(x$assessment_ids) == 200L &&
              length(intersect(x$analysis_ids, x$assessment_ids)) == 0L &&
              identical(sort(c(x$analysis_ids, x$assessment_ids)), sort(outer_analysis_ids))
            }, logical(1)))
          }, logical(1)))
          split_variables <- unique(c(names(outer_assignments), names(inner_assignments)))
          forbidden_split_fields <- c("Scenario", "Phenotype", "Observed", "TrueGeneticValue", "Model")
          split_independence_ok <- !any(forbidden_split_fields %in% split_variables)

          add_compat_check("Canonical input files", compat_check_status(all(files_exist)), if (all(files_exist)) "Canonical simulated object and audit summary are present." else paste("Missing:", paste(required_files[!files_exist], collapse = ", ")))
          add_compat_check("Simulated-data audit prerequisite", compat_check_status(n_blocked_audit == 0L), paste(n_blocked_audit, "blocking check(s) in simulated-data audit."))
          add_compat_check("Canonical object components", compat_check_status(components_ok), if (components_ok) paste("Required components present:", paste(required_components, collapse = ", ")) else paste("Missing components:", paste(setdiff(required_components, names(simulated_common)), collapse = ", ")))
          add_compat_check("Individual universe", compat_check_status(individual_universe_ok), "Expected 1000 unique row identifiers aligned with phenotype, true genetic value, and genotype matrices.")
          add_compat_check("Outer assignment row count", compat_check_status(outer_row_count_ok), paste("Observed rows:", nrow(outer_assignments), "; expected:", length(ids) * N_OUTER_REPEATS))
          add_compat_check("One outer assignment per ID and repetition", compat_check_status(outer_once_per_repeat), "Each individual must occur exactly once in every repetition.")
          add_compat_check("Balanced outer folds", compat_check_status(outer_balanced), "Every outer split must contain 800 analysis and 200 assessment individuals.")
          add_compat_check("Distinct outer repetitions", compat_check_status(unique_repetition_patterns, failure = "WARNING"), paste("All", N_OUTER_REPEATS, "repetitions should use distinct fold assignments."))
          add_compat_check("Outer assessment frequency", compat_check_status(assessment_frequency_ok), paste("Every individual is assigned to one assessment fold per repetition and therefore appears in exactly", N_OUTER_REPEATS, "outer assessment sets."))
          add_compat_check("Outer split integrity", compat_check_status(outer_split_integrity), paste(length(outer_splits), "outer split objects checked for size, disjointness, and complete coverage."))
          add_compat_check("Inner assignment row count", compat_check_status(inner_row_count_ok), paste("Observed rows:", nrow(inner_assignments), "; expected:", length(outer_splits) * 800L))
          add_compat_check("Balanced inner folds", compat_check_status(inner_balanced), "Every inner split must contain 600 analysis and 200 assessment individuals.")
          add_compat_check("Inner assignment integrity", compat_check_status(inner_assignment_integrity), "Inner assignments are restricted to the corresponding outer analysis set.")
          add_compat_check("Inner split integrity", compat_check_status(inner_split_integrity), paste(length(outer_splits) * N_INNER_FOLDS, "inner splits checked for size, disjointness, and complete outer-analysis coverage."))
          add_compat_check("Scenario-independent partitions", compat_check_status(split_independence_ok), "Partitions are generated from canonical individual IDs and deterministic seeds only; the same folds are reused for C1-C6 and all models.")
          add_compat_check("True genetic value excluded from partitioning", "PASS", "True simulated genetic values are stored in the canonical data object for final evaluation only and are not referenced when generating folds.")
          add_compat_check("Phenotype excluded from partitioning", "PASS", "Phenotypes are not used to construct folds. They may be used later inside training data and inner-CV tuning, never to redefine partitions.")

          validation_log$Status <- factor(validation_log$Status, levels = c("BLOCKED", "WARNING", "PASS"))
          validation_log <- validation_log[order(validation_log$Status), , drop = FALSE]
          rownames(validation_log) <- NULL
          ```
          '''
          marker = '# Observed validation structure\n'
          if marker not in validation_text:
              raise RuntimeError('M02 observed validation marker not found')
          validation_text = validation_text.replace(marker, validation_contract + '\n' + marker, 1)
          validation_text = validation_text.replace(
              'write.csv(\n  validation_observed,\n  file.path(output_dir, "simulated_cv_design_audit.csv"),',
              'write.csv(\n  validation_log,\n  file.path(output_dir, "simulated_cv_design_audit.csv"),',
              1,
          )
          validation_text = validation_text.replace('audit = validation_observed', 'audit = validation_log', 1)
          validation.write_text(validation_text)

          # Normalize only malformed whitespace-separated [[...]] expressions
          # already present in the current ANN source.
          ann = Path('analysis/simulated_data_ann.Rmd')
          ann_text = ann.read_text()
          broken_double_index = re.compile(
              r'(?P<object>[A-Za-z.][A-Za-z0-9._]*(?:\$[A-Za-z.][A-Za-z0-9._]*)*)'
              r'\[\s+\[\s*(?P<index>[^\[\]]+?)\s*\]\s*\]'
          )
          ann_text, n_repaired = broken_double_index.subn(
              lambda m: f"{m.group('object')}[[{m.group('index').strip()}]]",
              ann_text,
          )
          if n_repaired < 1 or broken_double_index.search(ann_text):
              raise RuntimeError('ANN double-index normalization did not complete')
          ann.write_text(ann_text)
          print('Normalized ANN double-index expressions:', n_repaired)

          # Extract all R chunks for parser validation.
          files = [
              Path('analysis/simulated_data_audit.Rmd'),
              Path('analysis/simulated_data_validation.Rmd'),
              Path('analysis/simulated_data_gblup.Rmd'),
              Path('analysis/simulated_data_ann.Rmd'),
              Path('analysis/simulated_data_comparison.Rmd'),
          ]
          temp = Path('/tmp/rmd-contract-parse')
          temp.mkdir(parents=True, exist_ok=True)
          for path in files:
              lines = path.read_text().splitlines()
              code = []
              in_chunk = False
              for line in lines:
                  if not in_chunk and re.match(r'^```\{r(?:[ ,}]|$)', line):
                      in_chunk = True
                      code.append(f'# ---- {line} ----')
                      continue
                  if in_chunk and line.strip() == '```':
                      in_chunk = False
                      code.append('')
                      continue
                  if in_chunk:
                      code.append(line)
              if in_chunk:
                  raise RuntimeError(f'unclosed R chunk in {path}')
              rcode = '\n'.join(code) + '\n'
              if re.search(r'\bstopifnot\s*\(', rcode) or re.search(r'\bstop\s*\(', rcode):
                  raise RuntimeError(f'defensive stop remains in {path}')
              (temp / f'{path.stem}.R').write_text(rcode)

          if 'stale_epochs >= PATIENCE' not in ann_text or 'break' not in ann_text:
              raise RuntimeError('ANN early stopping logic was not preserved')
          PY

      - name: Parse all five R tutorials
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/rmd-contract-parse/*.R; do
            echo "Parsing $f"
            Rscript -e "parse(file='$f'); cat('OK\n')"
          done

      - name: Verify scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          rm -f \
            .github/workflows/reader-first-cleanup.yml \
            .github/workflows/reader-first-diagnostic.yml \
            .github/workflows/reader-first-finalize.yml \
            .github/workflows/reader-first-contract-finalize.yml

          echo '===== FINAL WORKTREE ====='
          git status --short

          unexpected=$(git status --short | awk '{print $2}' | grep -Ev '^(analysis/simulated_data_(audit|validation|gblup|ann|comparison)\.Rmd|\.github/workflows/reader-first-(cleanup|diagnostic|finalize|contract-finalize)\.yml)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected paths:"
            echo "$unexpected"
            exit 1
          fi

          if ! git diff --quiet -- output; then
            echo 'output/ changed unexpectedly'
            git diff --stat -- output
            exit 1
          fi

          git config user.name "github-actions[bot]"
