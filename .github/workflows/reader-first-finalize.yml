name: reader-first-finalize

on:
  push:
    branches:
      - didactic-reader-first-cleanup

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: didactic-reader-first-cleanup
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Apply reader-first transformation and normalize syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/reader-first-cleanup.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'reader-first-cleanup.py', 'exec'))

          audit = Path('analysis/simulated_data_audit.Rmd')
          audit_text = audit.read_text()
          old_regex = r'"^\s*Escal"'
          new_regex = r'"^\\s*Escal"'
          if old_regex not in audit_text:
              raise RuntimeError('Expected transformed audit regex escape was not found')
          audit_text = audit_text.replace(old_regex, new_regex)
          audit.write_text(audit_text)

          ann = Path('analysis/simulated_data_ann.Rmd')
          text = ann.read_text()

          # The current main branch contains several intended [[...]] accesses
          # formatted as object[ newline [index] newline ]. Normalize only that
          # malformed, whitespace-separated form. Already-valid [[...]] and
          # ordinary single-bracket matrix/vector indexing are untouched.
          broken_double_index = re.compile(
              r'(?P<object>[A-Za-z.][A-Za-z0-9._]*(?:\$[A-Za-z.][A-Za-z0-9._]*)*)'
              r'\[\s+\[\s*(?P<index>[^\[\]]+?)\s*\]\s*\]'
          )

          repaired = []

          def repair_double_index(match):
              object_name = match.group('object')
              index = match.group('index').strip()
              repaired.append(f'{object_name}[[{index}]]')
              return f'{object_name}[[{index}]]'

          text, n_repaired = broken_double_index.subn(repair_double_index, text)
          if n_repaired < 1:
              raise RuntimeError('No malformed ANN double-index expression was found')

          remaining = broken_double_index.search(text)
          if remaining:
              raise RuntimeError(
                  'Malformed ANN double indexing remains after normalization: '
                  + remaining.group(0)
              )

          print('Normalized ANN double-index expressions:', n_repaired)
          for expression in repaired:
              print('  ', expression)

          ann.write_text(text)

          files = [
              Path('analysis/simulated_data_audit.Rmd'),
              Path('analysis/simulated_data_validation.Rmd'),
              Path('analysis/simulated_data_gblup.Rmd'),
              Path('analysis/simulated_data_ann.Rmd'),
              Path('analysis/simulated_data_comparison.Rmd'),
          ]

          def extract_r_chunks(path):
              lines = path.read_text().splitlines()
              code = []
              in_chunk = False
              for line in lines:
                  if not in_chunk and re.match(r'^```\{r(?:[ ,}]|$)', line):
                      in_chunk = True
                      code.append(f'# ---- {line} ----')
                      continue
                  if in_chunk and line.strip() == '```':
                      in_chunk = False
                      code.append('')
                      continue
                  if in_chunk:
                      code.append(line)
              if in_chunk:
                  raise RuntimeError(f'unclosed R chunk in {path}')
              return '\n'.join(code) + '\n'

          temp = Path('/tmp/rmd-parse-final')
          temp.mkdir(parents=True, exist_ok=True)
          for path in files:
              rcode = extract_r_chunks(path)
              if re.search(r'\bstopifnot\s*\(', rcode):
                  raise RuntimeError(f'stopifnot remains in {path}')
              if re.search(r'\bstop\s*\(', rcode):
                  raise RuntimeError(f'defensive stop() remains in {path}')
              (temp / f'{path.stem}.R').write_text(rcode)

          ann_text = ann.read_text()
          if 'stale_epochs >= PATIENCE' not in ann_text or 'break' not in ann_text:
              raise RuntimeError('ANN early stopping logic was not preserved')
          if 'self$linears[[layer_index]]' not in ann_text:
              raise RuntimeError('ANN forward indexing was not repaired')
          if 'model$linears[[layer_index]]' not in ann_text:
              raise RuntimeError('ANN penalty indexing was not repaired')
          if 'weights[[length(weights) + 1L]]' not in ann_text:
              raise RuntimeError('ANN output-weight indexing was not repaired')
          if 'structure_summary_rows[[candidate_index]]' not in ann_text:
              raise RuntimeError('ANN structure-summary indexing was not repaired')
          if 'structure_fold_rows[[candidate_index]]' not in ann_text:
              raise RuntimeError('ANN structure-fold indexing was not repaired')
          PY

      - name: Parse all transformed R code
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/rmd-parse-final/*.R; do
            echo "Parsing $f"
            Rscript -e "parse(file='$f'); cat('OK\n')"
          done

      - name: Verify scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo '===== CHANGED PATHS BEFORE WORKFLOW CLEANUP ====='
          git status --short

          rm -f \
            .github/workflows/reader-first-cleanup.yml \
            .github/workflows/reader-first-diagnostic.yml \
            .github/workflows/reader-first-finalize.yml

          echo '===== FINAL CHANGED PATHS ====='
          git status --short

          unexpected=$(git status --short | awk '{print $2}' | grep -Ev '^analysis/simulated_data_(audit|validation|gblup|ann|comparison)\.Rmd$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi

          if ! git diff --quiet -- output; then
            echo 'output/ changed unexpectedly'
            git diff --stat -- output
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify tutorials with reader-facing summaries"
          git push origin HEAD:didactic-reader-first-cleanup
