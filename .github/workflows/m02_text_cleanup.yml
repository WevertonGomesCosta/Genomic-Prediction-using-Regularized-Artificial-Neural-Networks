name: One-time M02 wording cleanup

on:
  push:
    branches:
      - m02-direct-reader-flow

permissions:
  contents: write

jobs:
  cleanup-m02:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: m02-direct-reader-flow
          fetch-depth: 0

      - name: Refine reader-facing wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("analysis/simulated_data_validation.Rmd")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "- **Repeated outer cross-validation:** 5 repetitions of 5 outer folds produce\n  25 independent model evaluations.":
              "- **Repeated outer cross-validation:** 5 repetitions of 5 outer folds produce\n  25 outer held-out evaluations.",
              "- **Scenario-independent:** C1-C6 use exactly the same individual partitions.":
              "- **Same across scenarios:** C1-C6 use exactly the same individual partitions.",
              "- **Model-independent:** GBLUP-ADE and all ANN variants use the same outer\n  assessment individuals.":
              "- **Same across models:** GBLUP-ADE and all ANN variants use the same outer\n  assessment individuals.",
              "- **Phenotype-independent:** response values do not influence who is assigned to\n  a fold.":
              "- **Phenotype not used:** response values do not influence who is assigned to\n  a fold.",
              "- **True-G-independent:** known simulated genetic values are reserved for\n  held-out evaluation and never determine partitions or ANN tuning.":
              "- **True genetic value not used:** known simulated genetic values are reserved for\n  held-out evaluation and never determine partitions or ANN tuning."
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected text not found:\n{old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit wording cleanup and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/m02_text_cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine M02 validation wording"
          git push origin HEAD:m02-direct-reader-flow
